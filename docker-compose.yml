services:
  postgres-identity:
    image: postgres:18.4-trixie
    container_name: shiori-postgres-identity
    restart: unless-stopped
    environment:
      POSTGRES_USER: shiori_identity
      POSTGRES_PASSWORD: ${SHIORI_IDENTITY_POSTGRES_PASSWORD:?SHIORI_IDENTITY_POSTGRES_PASSWORD is required}
      POSTGRES_DB: shiori_identity
    ports:
      - "5432:5432"
    volumes:
      - postgres-identity-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=\"$${POSTGRES_PASSWORD}\" psql -w -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -v ON_ERROR_STOP=1 -c 'SELECT 1;' >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - shiori-network

  postgres-tracking:
    image: postgres:18.4-trixie
    container_name: shiori-postgres-tracking
    restart: unless-stopped
    environment:
      POSTGRES_USER: shiori_tracking
      POSTGRES_PASSWORD: ${SHIORI_TRACKING_POSTGRES_PASSWORD:?SHIORI_TRACKING_POSTGRES_PASSWORD is required}
      POSTGRES_DB: shiori_tracking
    ports:
      - "5433:5432"
    volumes:
      - postgres-tracking-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "PGPASSWORD=\"$${POSTGRES_PASSWORD}\" psql -w -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -v ON_ERROR_STOP=1 -c 'SELECT 1;' >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - shiori-network

  mongodb:
    image: mongo:8
    container_name: shiori-mongodb
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shiori-network

  rabbitmq:
    image: rabbitmq:4.3.5-management
    container_name: shiori-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: shiori
      RABBITMQ_DEFAULT_PASS: ${SHIORI_RABBITMQ_PASSWORD:?SHIORI_RABBITMQ_PASSWORD is required}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity",
        ]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s
    networks:
      - shiori-network


networks:
  shiori-network:
    name: shiori-network

volumes:
  postgres-identity-data:
    name: shiori-postgres-identity-data
  postgres-tracking-data:
    name: shiori-postgres-tracking-data
  mongodb-data:
    name: shiori-mongodb-data
  rabbitmq-data:
    name: shiori-rabbitmq-data
